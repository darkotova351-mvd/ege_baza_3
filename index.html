    :root{--green-dark:#24513d;--green:#3d7658;--green-soft:#78a98c;--mint:#ddeee3;--pistachio:#eef3d9;--bg:#f7faf7;--card:#fff;--text:#25322b;--muted:#6e7972;--warm:#f4e9c9;--coral:#f2d6ca;--coral-text:#8b4e3e;--line:#dce6de;--shadow:0 14px 38px rgba(36,81,61,.09)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f9fcf9 0%,#f3f8f4 100%);color:var(--text);font-family:"Nunito",Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .shell{width:min(1240px,calc(100% - 32px));margin:0 auto}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(36,81,61,.1)}.brand{font-weight:800;color:var(--green-dark);letter-spacing:.1px}.top-meta{color:var(--muted);font-size:14px}
    .start-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:42px 0}.start-card{width:min(760px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:52px;box-shadow:var(--shadow);position:relative;overflow:hidden}.start-card:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--pistachio);right:-100px;top:-120px}.eyebrow{display:inline-flex;padding:8px 12px;border-radius:999px;background:var(--mint);color:var(--green-dark);font-weight:800;font-size:14px;position:relative}.start-card h1{font-size:clamp(34px,5vw,54px);line-height:1.08;margin:24px 0 14px;position:relative}.lead{font-size:19px;line-height:1.65;color:#526158;max-width:620px;position:relative}.start-stats{display:flex;gap:12px;margin:28px 0;flex-wrap:wrap}.stat-pill{padding:11px 15px;border:1px solid var(--line);border-radius:14px;background:#fbfdfb;font-weight:700}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.btn{border:none;border-radius:14px;padding:14px 20px;font-weight:800;transition:.18s transform,.18s background,.18s box-shadow}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--green-dark);color:white;box-shadow:0 8px 18px rgba(36,81,61,.18)}.btn-primary:hover{background:#193f2e}.btn-secondary{background:var(--mint);color:var(--green-dark)}.btn-ghost{background:transparent;color:var(--green);border:1px solid var(--line)}.btn-warm{background:var(--warm);color:#6d5920}.btn-coral{background:var(--coral);color:var(--coral-text)}.btn-small{padding:10px 14px;font-size:14px}.resume-note{margin:18px 0;color:var(--muted);font-size:14px}
    .workspace{padding:26px 0 44px}.workspace-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:16px}.workspace-head h1{font-size:25px;margin:0 0 6px}.workspace-head p{margin:0;color:var(--muted)}.score-mini{background:white;border:1px solid var(--line);border-radius:16px;padding:12px 16px;text-align:right;min-width:160px}.score-mini strong{display:block;font-size:21px;color:var(--green-dark)}
    .progress-nav{display:grid;grid-template-columns:repeat(21,1fr);gap:6px;margin-bottom:18px}.nav-dot{height:39px;min-width:0;border:1px solid var(--line);background:white;border-radius:10px;font-weight:800;color:var(--muted);padding:0}.nav-dot.current{outline:3px solid rgba(61,118,88,.2);border-color:var(--green);color:var(--green-dark)}.nav-dot.self{background:var(--mint);color:var(--green-dark);border-color:#bdd8c6}.nav-dot.help{background:var(--warm);color:#725d23;border-color:#e1d29f}.nav-dot.together{background:var(--coral);color:var(--coral-text);border-color:#dfbbaa}
    .question-card{background:white;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:30px}.q-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}.q-number{display:flex;gap:12px;align-items:center}.q-badge{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:var(--green-dark);color:white;font-size:21px;font-weight:900}.q-topic{font-size:13px;color:var(--green);font-weight:800;margin-bottom:4px}.q-progress{font-size:18px;font-weight:900}.status-chip{border-radius:999px;padding:9px 13px;font-weight:800;font-size:13px;white-space:nowrap}.chip-self{background:var(--mint);color:var(--green-dark)}.chip-help{background:var(--warm);color:#725d23}.chip-together{background:var(--coral);color:var(--coral-text)}

  function taskDetailHTML(q,i){const it=state.items[i];return `<div class="task-row"><strong>№${q.id} · ${esc(q.topic)}</strong>${itemStatus(it)} · Самостоятельный балл: ${it.examScore}<br>Попыток: ${it.attempts} · Подсказка: ${it.hintUsed?'да':'нет'}<br>Ответ ученицы: ${esc(it.userAnswer||'—')}<br>${esc(q.micro.join(' · '))}<br>${diagnostic(it.status)}</div>`;}
  function tags(arr,empty='Нет тем в этой категории'){return `<div class="topic-tags">${arr.length?arr.map(x=>`<span class="topic-tag">${esc(x)}</span>`).join(''):`<span class="topic-tag">${empty}</span>`}</div>`;}
  function reportHTML(tab){const s=stats(),grade=getGrade(s.self),title='<p class="report-title">Пробник № 3 | ЕГЭ база</p>';if(tab==='teacher')return `<div class="report">${title}<h3>Отчёт для преподавателя</h3><p><strong>Самостоятельный результат: ${s.self} / 21</strong><br>Оценка: ${grade.grade} («${grade.label}»)</p>${summaryHTML()}<h4>Карта крупных тем</h4><div class="group-grid">${GROUPS.map(g=>`<div class="group-row"><strong>${g.name}</strong><br><span class="subtle">${groupStatsText(g)}</span><br>${groupLevel(g)}</div>`).join('')}</div><h4>Сильные стороны</h4>${tags(uniqueTopics('self'),'Пока нет заданий, решённых с первой попытки без подсказки')}<h4>Требуют закрепления</h4>${tags(uniqueTopics('help'),'Таких тем на этом варианте нет')}<h4>Нужен разбор способа решения</h4>${tags(uniqueTopics('together'),'Таких тем на этом варианте нет')}<h4>Карта всех заданий</h4><div class="task-map">${Q.map(taskDetailHTML).join('')}</div><h4>Что взять в работу дальше</h4><ul>${recommendations().map(x=>`<li>${x}</li>`).join('')}</ul><div class="report-actions"><span class="subtle">Математика с Дарьей</span><button class="btn btn-primary" data-download="teacher">Скачать результат для преподавателя</button></div></div>`;
    if(tab==='parent')return `<div class="report">${title}<h3>Результат для родителя</h3><p><strong>Самостоятельно: ${s.self} из 21</strong><br>Оценка по результату пробника: ${grade.grade} («${grade.label}»)</p>${summaryHTML()}<p>Самостоятельный балл начислялся только за правильный ответ с первой попытки без подсказки. Исправленные ответы и решения с подсказками отмечены отдельно.</p><h4>Уверенно получается</h4>${tags(uniqueTopics('self'),'Пока нет тем, подтверждённых самостоятельным решением с первой попытки')}<h4>Что сейчас закрепляем</h4>${tags(uniqueTopics('help'),'Таких тем на этом варианте нет')}<h4>Что стоит разобрать подробнее</h4>${tags(uniqueTopics('together'),'Таких тем на этом варианте нет')}<h4>Рекомендации</h4><ul>${recommendations().map(x=>`<li>${x}</li>`).join('')}</ul><p>На ближайших занятиях можно разобрать трудные задания и закрепить их на похожих примерах, затем проверить навыки в новом варианте.</p><div class="report-actions"><span class="subtle">Математика с Дарьей</span><button class="btn btn-primary" data-download="parent">Скачать результат для родителя</button></div></div>`;
    return `<div class="report">${title}<h3>Вариант пройден 🎉</h3><p><strong>Самостоятельный результат: ${s.self} / 21</strong><br>Оценка: ${grade.grade} · ${grade.label}</p>${summaryHTML()}<h4>Твои сильные темы</h4>${tags(uniqueTopics('self'),'Эти темы ещё предстоит подтвердить самостоятельным решением')}<h4>Успешно решены с первой попытки</h4><p>${Q.filter((q,i)=>state.items[i].status==='self').map(q=>'№'+q.id).join(', ')||'В этом пробнике таких заданий пока нет.'}</p><h4>Эти темы ещё закрепим</h4>${tags(uniqueTopics('help'),'Таких тем на этом варианте нет')}<h4>К ним вернёмся подробнее</h4>${tags(uniqueTopics('together'),'Таких тем на этом варианте нет')}<p>${studentMessage()}</p><h4>С чего начать повторение</h4><ul>${recommendations().map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn btn-secondary" data-action="student-map">Посмотреть задания</button><div class="student-map" id="student-map"><div class="task-map">${Q.map((q,i)=>`<div class="task-row"><strong>№${q.id} · ${q.topic}</strong>${itemStatus(state.items[i])}</div>`).join('')}</div></div><div class="report-actions"><span class="subtle">Математика с Дарьей</span><button class="btn btn-primary" data-download="student">Скачать результат для ученицы</button></div></div>`;}
  function renderFinal(){const s=stats(),grade=getGrade(s.self),tab=state.reportTab||'teacher';app.innerHTML=`<div class="shell final-wrap"><section class="final-card"><div class="final-hero"><div class="check-circle">✓</div><h2>Пробник № 3 завершён</h2><div class="final-score">${s.self} / 21</div><div>самостоятельный экзаменационный результат</div><div class="grade-line">Оценка: ${grade.grade} · ${grade.label}</div></div>${summaryHTML()}<div class="tabs"><button class="tab ${tab==='teacher'?'active':''}" data-tab="teacher">Для преподавателя</button><button class="tab ${tab==='parent'?'active':''}" data-tab="parent">Для родителя</button><button class="tab ${tab==='student'?'active':''}" data-tab="student">Для ученицы</button></div>${reportHTML(tab)}<div style="margin-top:18px"><button class="btn btn-ghost" data-action="review">Посмотреть задания</button></div></section></div>`;}
  function setAnswerFromUI(target){const q=Q[state.current],it=state.items[state.current];if(target.id==='answer'){it.userAnswer=target.value;}else if(target.dataset.match!==undefined){const pos=Number(target.dataset.match),a=(it.userAnswer||'').padEnd(4,' ').slice(0,4).split('');a[pos]=target.value||' ';it.userAnswer=a.join('').trimEnd();}save();}
  document.addEventListener('input',e=>setAnswerFromUI(e.target));document.addEventListener('change',e=>setAnswerFromUI(e.target));
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.jump!==undefined){state.current=Number(b.dataset.jump);state.screen='question';save();render();return}if(b.dataset.choice){const it=state.items[state.current];if(it.completed)return;const n=b.dataset.choice,arr=(it.userAnswer||'').split('').filter(Boolean);const ix=arr.indexOf(n);ix>=0?arr.splice(ix,1):arr.push(n);it.userAnswer=arr.sort().join('');save();renderQuestion();return}if(b.dataset.tab){state.reportTab=b.dataset.tab;save();renderFinal();return}if(b.dataset.download){downloadReport(b.dataset.download);return}const a=b.dataset.action;if(a==='start'){state=fresh();state.started=true;state.screen='question';save();render()}else if(a==='continue'){state.screen='question';render()}else if(a==='reset'){if(confirm('Начать вариант заново? Все сохранённые ответы и результаты будут удалены.')){state=fresh();localStorage.removeItem(KEY);render()}}else if(a==='check')checkAnswer();else if(a==='retry'){state.items[state.current].feedback='';save();renderQuestion();setTimeout(()=>document.getElementById('answer')?.focus(),0)}else if(a==='hint'){const it=state.items[state.current];if(it.completed)return;it.hintUsed=true;save();renderQuestion()}else if(a==='together')markTogether();else if(a==='show-answer'){if(confirm('Показать правильный ответ?'))showAnswer()}else if(a==='prev'){state.current=Math.max(0,state.current-1);save();renderQuestion()}else if(a==='next')next();else if(a==='continue-milestone'){const n=state.items.findIndex((x,i)=>i>=state.milestone&&!x.completed);if(n>=0){state.current=n;state.screen='question';}else{state.screen='final';}save();render()}else if(a==='review'){state.current=0;state.screen='question';save();render()}else if(a==='student-map'){const m=document.getElementById('student-map');m.style.display=m.style.display==='block'?'none':'block';b.textContent=m.style.display==='block'?'Скрыть задания':'Посмотреть задания';}});
  function wrap(ctx,text,x,y,maxWidth,lineHeight,maxLines=99){const words=String(text).split(/\s+/);let line='',lines=0;for(let i=0;i<words.length;i++){const test=line?line+' '+words[i]:words[i];if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;lines++;line=words[i];if(lines>=maxLines)return y;}else line=test;}if(line&&lines<maxLines){ctx.fillText(line,x,y);y+=lineHeight;}return y;}
  function canvasBase(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#F8FBF8';x.fillRect(0,0,w,h);x.fillStyle='#DDEDE2';x.beginPath();x.arc(w-90,90,180,0,Math.PI*2);x.fill();x.fillStyle='#24513D';x.font='800 28px Nunito, Arial';x.fillText('Математика с Дарьей',70,76);return {c,x};}
  function box(ctx,x,y,w,h,fill='#FFFFFF'){ctx.fillStyle=fill;ctx.strokeStyle='#DCE6DE';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,w,h,20);ctx.fill();ctx.stroke();}
  function drawHeader(ctx,title,s){const grade=getGrade(s.self);ctx.fillStyle='#25322B';ctx.font='800 48px Nunito, Arial';ctx.fillText('Пробник № 3 | ЕГЭ база',70,150);ctx.fillStyle='#526158';ctx.font='700 25px Nunito, Arial';ctx.fillText(title,70,190);ctx.fillStyle='#24513D';ctx.font='900 70px Nunito, Arial';ctx.fillText(`${s.self} / 21`,70,272);ctx.fillStyle='#6E7972';ctx.font='27px Nunito, Arial';ctx.fillText('самостоятельный результат',335,257);ctx.fillStyle='#24513D';ctx.font='800 25px Nunito, Arial';ctx.fillText(`Оценка: ${grade.grade} · ${grade.label}`,70,316);}
  function drawStats(ctx,s,y,w){const labels=[['Решено самостоятельно',s.self,'#DDEDE2'],['Решено после ошибки или с подсказкой',s.help,'#F4E9C9'],['Не смогла решить',s.together,'#F2D6CA']];const gap=18,bw=(w-140-gap*2)/3;labels.forEach((a,i)=>{const x=70+i*(bw+gap);box(ctx,x,y,bw,166,a[2]);ctx.fillStyle='#24513D';ctx.font='900 42px Nunito, Arial';ctx.fillText(String(a[1]),x+22,y+50);ctx.fillStyle='#25322B';ctx.font='700 21px Nunito, Arial';wrap(ctx,a[0],x+22,y+84,bw-44,27,3)});return y+194;}
  function drawSection(ctx,title,y){y+=30;ctx.fillStyle='#24513D';ctx.font='800 31px Nunito, Arial';ctx.fillText(title,70,y);return y+28;}
  function drawTagsCanvas(ctx,arr,y,w,empty='Таких тем на этом варианте нет'){if(!arr.length)arr=[empty];ctx.font='23px Nunito, Arial';for(const t of arr){const text='• '+t;const words=text.split(/\s+/);let lines=1,line='';for(const word of words){const next=line?line+' '+word:word;if(ctx.measureText(next).width>w-180&&line){lines++;line=word}else line=next}const height=26+lines*30;box(ctx,70,y,w-140,height,'#FFFFFF');ctx.fillStyle='#25322B';wrap(ctx,text,90,y+35,w-180,30);y+=height+10;}return y+8;}
  function finishCanvas(source,y){const c=document.createElement('canvas');c.width=source.width;c.height=Math.ceil(y+90);const x=c.getContext('2d');x.drawImage(source,0,0);x.fillStyle='#6E7972';x.font='20px Nunito, Arial';x.fillText('Пробник № 3 | ЕГЭ база · Математика с Дарьей',70,c.height-35);return c;}
  function drawRecommendations(ctx,y,w){y=drawSection(ctx,'Что взять в работу дальше',y);ctx.fillStyle='#25322B';ctx.font='23px Nunito, Arial';for(const r of recommendations())y=wrap(ctx,'• '+r,86,y+16,w-170,31)+8;return y;}
  function buildCanvas(kind){const s=stats();const topicSets=[uniqueTopics('self'),uniqueTopics('help'),uniqueTopics('together')];if(kind==='teacher'){const {c,x}=canvasBase(1600,6500);drawHeader(x,'Диагностическая карта · для преподавателя',s);let y=350;y=drawStats(x,s,y,1600);y=drawSection(x,'Карта крупных тем',y);GROUPS.forEach(g=>{box(x,70,y,1460,105);x.fillStyle='#25322B';x.font='700 23px Nunito, Arial';x.fillText(g.name,92,y+31);x.font='19px Nunito, Arial';x.fillStyle='#6E7972';wrap(x,groupStatsText(g),92,y+62,850,25);x.textAlign='right';x.fillStyle='#3D7658';x.font='700 20px Nunito, Arial';x.fillText(groupLevel(g),1505,y+47);x.textAlign='left';y+=117});y+=10;y=drawSection(x,'Сильные стороны',y);y=drawTagsCanvas(x,topicSets[0],y,1600,'Пока нет заданий, решённых с первой попытки без подсказки');y=drawSection(x,'Требуют закрепления',y);y=drawTagsCanvas(x,topicSets[1],y,1600);y=drawSection(x,'Нужен разбор способа решения',y);y=drawTagsCanvas(x,topicSets[2],y,1600);y=drawSection(x,'Карта всех 21 заданий',y);const colW=710,rowH=188;Q.forEach((q,i)=>{const it=state.items[i],col=i<11?0:1,row=i<11?i:i-11,bx=70+col*(colW+40),by=y+row*rowH;box(x,bx,by,colW,rowH-12);x.fillStyle='#25322B';x.font='700 21px Nunito, Arial';let cy=wrap(x,`№${q.id} · ${q.topic}`,bx+16,by+29,colW-32,26);x.font='19px Nunito, Arial';x.fillStyle='#526158';cy=wrap(x,itemStatus(it),bx+16,cy+4,colW-32,25);x.fillText(`Балл: ${it.examScore} · Попыток: ${it.attempts} · Подсказка: ${it.hintUsed?'да':'нет'}`,bx+16,cy+3);cy+=29;wrap(x,`Ответ ученицы: ${it.userAnswer||'—'}`,bx+16,cy+3,colW-32,24,2)});y+=11*rowH+12;y=drawRecommendations(x,y,1600);return finishCanvas(c,y)}
    const {c,x}=canvasBase(1080,6200);drawHeader(x,kind==='parent'?'Результат для родителя':'Результат для ученицы',s);let y=350;y=drawStats(x,s,y,1080);if(kind==='parent'){x.fillStyle='#526158';x.font='23px Nunito, Arial';y=wrap(x,'Самостоятельный балл начислялся за правильный ответ с первой попытки без подсказки. Исправленные ответы и решения с подсказкой отмечены отдельно.',70,y+6,940,31)+20;}y=drawSection(x,kind==='parent'?'Уверенно получается':'Твои сильные темы',y);y=drawTagsCanvas(x,topicSets[0],y,1080,'Пока нет заданий, решённых с первой попытки без подсказки');if(kind==='student'){y=drawSection(x,'Успешно решены с первой попытки',y);x.fillStyle='#25322B';x.font='23px Nunito, Arial';const solved=Q.filter((q,i)=>state.items[i].status==='self').map(q=>'№'+q.id).join(', ');y=wrap(x,solved||'В этом пробнике таких заданий пока нет.',70,y+5,940,31)+15;}y=drawSection(x,kind==='parent'?'Что сейчас закрепляем':'Эти темы ещё закрепим',y);y=drawTagsCanvas(x,topicSets[1],y,1080);y=drawSection(x,kind==='parent'?'Что стоит разобрать подробнее':'К ним вернёмся подробнее',y);y=drawTagsCanvas(x,topicSets[2],y,1080);x.fillStyle='#526158';x.font='23px Nunito, Arial';y=wrap(x,kind==='parent'?'На ближайших занятиях можно разобрать трудные задания и закрепить их на похожих примерах, затем проверить навыки в новом варианте.':studentMessage(),70,y+10,940,32)+15;y=drawRecommendations(x,y,1080);return finishCanvas(c,y);}
  async function downloadReport(kind){await document.fonts.ready;const names={teacher:'ege_baza_probnik_3_teacher.png',parent:'ege_baza_probnik_3_parent.png',student:'ege_baza_probnik_3_student.png'};const c=buildCanvas(kind);c.toBlob(blob=>{if(!blob){toast('Не удалось создать PNG.');return}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=names[kind];document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('PNG-отчёт готов.');},'image/png');}
  render();
